<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nordic Horizons Yukon | Photos</title>
  <meta name="description" content="Découvrez les photos de Nordic Horizons Yukon et explorez le Yukon à travers nos services touristiques et logistiques." />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="photos-page">

<!-- ===== Modal único ===== -->
<div id="mediaModal" class="media-modal">
  <span class="modal-close">&times;</span>
  <img id="modalImage" alt="" />
  <video id="modalVideo" controls></video>
</div>

<!-- ===== Idiomas ===== -->
<div class="language-switch">
  <div class="lang-item" onclick="setLanguage('fr')">
    <img src="images/flag.png" alt="Français" />
    <span>FR</span>
  </div>
  <div class="lang-item" onclick="setLanguage('en')">
    <img src="images/flag.png" alt="English" />
    <span>EN</span>
  </div>
</div>

<!-- ===== Header ===== -->
<div class="hero-overlay">
  <div class="logo-container">
    <img src="images/logo_PeB.png" alt="Logo Nordic Horizons Yukon" />
  </div>

  <nav class="main-nav">
    <a href="index.html" data-i18n="menu_home"></a>
    <a href="about.html" data-i18n="menu_about"></a>
    <a href="photos.html" data-i18n="menu_photos"></a>
    <a href="contact.html" data-i18n="menu_contact"></a>
  </nav>
</div>

<!-- ===== Carrossel principal ===== -->
<div class="carousel">
  <div class="carousel-track">
    <div class="carousel-slide"><img src="images/photos/carrocel/photo6.jpg"></div>
    <div class="carousel-slide"><img src="images/photos/carrocel/photo6.jpg"></div>
    <div class="carousel-slide"><img src="images/photos/carrocel/photo6.jpg"></div>
  </div>

  <div class="carousel-buttons">
    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>
  </div>
</div>

<!-- ================== ÁLBUNS ================== -->

<!-- ===== Álbum: Carcross ===== -->
<section class="album">
  <h2 class="album-title" data-i18n="album_carcross">Carcross</h2>

  <div class="album-grid">
    <img src="images/photos/carcross/photo1.jpg" class="media-item">
    <img src="images/photos/carcross/photo2.jpg" class="media-item">
    <img src="images/photos/carcross/photo3.jpg" class="media-item">
    <img src="images/photos/carcross/photo4.jpg" class="media-item">
    <img src="images/photos/carcross/photo5.jpg" class="media-item">
    <img src="images/photos/carcross/photo6.jpg" class="media-item">
  </div>
</section>

<!-- ===== Álbum: Logistics ===== -->
<section class="album">
  <h2 data-i18n="album_logistics">Logistics Operations</h2>

  <div class="album-carousel">
    <img src="images/photos/logistics/log1.png" class="media-item">
    <img src="images/photos/logistics/log2.png" class="media-item">
  </div>
</section>

<!-- ===== Álbum: Wildlife ===== -->
<section class="album">
  <h2 data-i18n="album_wildlife">Yukon Wildlife</h2>

  <div class="album-carousel">
    <img src="images/photos/wildlife/wild1.png" class="media-item">
    <img src="images/photos/wildlife/wild2.png" class="media-item">
  </div>
</section>

<!-- ===== Álbum: Vídeos ===== -->
<section class="album">
  <h2 data-i18n="album_videos">Videos</h2>

  <div class="album-carousel">
    <video
      class="media-item video-thumb"
      src="videos/video1.mp4"
      muted
      playsinline
    ></video>
  </div>
</section>

<!-- ===== Footer ===== -->
<footer>
  <div class="footer-content">
    <div class="footer-left">
      <p>
        <span data-i18n="footer_email"></span>:
        <a href="mailto:nordichorizons.yukon@gmail.com">nordichorizons.yukon@gmail.com</a><br>
        <span data-i18n="footer_phone"></span>:
        <a href="tel:+18673343213">+1 867 334 3213</a>
      </p>
    </div>

    <div class="footer-center">
      <p>
        <span data-i18n="footer_rights"></span>
        <a href="https://www.seusite.com" target="_blank" rel="noopener">
          Douglas Portela
        </a>
      </p>
    </div>

    <div class="footer-right">
      <a href="https://facebook.com/nordichorizonsyukon" target="_blank">
        <img src="images/facebook.png" alt="Facebook">
      </a>
      <a href="https://instagram.com/nordichorizonsyukon" target="_blank">
        <img src="images/instagram.png" alt="Instagram">
      </a>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script src="photos.js"></script>
</body>
</html>
