<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nordic Horizons Yukon | Photos</title>
  <meta name="description" content="Découvrez les photos de Nordic Horizons Yukon et explorez le Yukon à travers nos services touristiques et logistiques." />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="photos-page">

<!-- ===== Modal único ===== -->
<div id="mediaModal" class="media-modal">
  <span class="modal-close">&times;</span>
  <img id="modalImage" alt="Photo" />
  <video id="modalVideo" controls playsinline></video>
</div>

<!-- ===== Idiomas ===== -->
<div class="language-switch">
  <div class="lang-item" onclick="setLanguage('fr')">
    <img src="images/flag.png" alt="Français" />
    <span>FR</span>
  </div>
  <div class="lang-item" onclick="setLanguage('en')">
    <img src="images/flag.png" alt="English" />
    <span>EN</span>
  </div>
</div>

<!-- ===== Header ===== -->
<div class="hero-overlay">
  <div class="logo-container">
    <img src="images/logo_PeB.png" alt="Logo Nordic Horizons Yukon" />
  </div>

  <nav class="main-nav">
    <a href="index.html" data-i18n="menu_home"></a>
    <a href="about.html" data-i18n="menu_about"></a>
    <a href="photos.html" data-i18n="menu_photos"></a>
    <a href="contact.html" data-i18n="menu_contact"></a>
  </nav>
</div>

<!-- ===== Carrossel principal ===== -->
<div class="carousel">
  <div class="carousel-track">
    <div class="carousel-slide">
      <img src="images/photos/carrocel/photo1.png" alt="Yukon Photo">
    </div>
    <div class="carousel-slide">
      <img src="images/photos/carrocel/carcross.jpg" alt="Yukon Photo">
    </div>
    <div class="carousel-slide">
      <img src="images/photos/carrocel/dawson.jpg" alt="Yukon Photo">
    </div>
  </div>

  <div class="carousel-buttons">
    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>
  </div>
</div>

<!-- ================== ÁLBUNS ================== -->

<!-- ===== Álbum: Whitehorse ===== -->
<section class="album">
  <h2 class="album-title" data-i18n="album_whitehorse">Whitehorse</h2>

  <div class="album-grid">
    <img src="images/photos/whitehorse/photo1.png" class="media-item" alt="">
    <img src="images/photos/whitehorse/photo2.jpg" class="media-item" alt="">
    <img src="images/photos/whitehorse/photo3.jpg" class="media-item" alt="">
    <img src="images/photos/whitehorse/photo4.jpg" class="media-item" alt="">
    <img src="images/photos/whitehorse/photo5.jpg" class="media-item" alt="">
    <img src="images/photos/whitehorse/photo6.jpg" class="media-item" alt="">
    <img src="images/photos/whitehorse/photo7.jpg" class="media-item" alt="">
    <img src="images/photos/whitehorse/photo8.jpg" class="media-item" alt="">
  </div>
</section>

<!-- ===== Álbum: Carcross ===== -->
<section class="album">
  <h2 class="album-title" data-i18n="album_carcross">Carcross</h2>

  <div class="album-grid">
    <img src="images/photos/carcross/photo1.jpg" class="media-item" alt="">
    <img src="images/photos/carcross/photo2.jpg" class="media-item" alt="">
    <img src="images/photos/carcross/photo3.jpg" class="media-item" alt="">
    <img src="images/photos/carcross/photo4.jpg" class="media-item" alt="">

<!-- ===== Álbum: Dawson ===== -->

    <img src="images/photos/dawson/photo1.jpg" class="media-item" alt="">

</section>

<!-- ===== Álbum: Vídeos ===== -->
<section class="album">
  <h2 data-i18n="album_videos">Videos</h2>

  <div class="album-grid">
    <video
      class="media-item video-thumb"
      src="images/photos/video1.mp4"
      muted
      playsinline
    ></video>
  </div>
</section>
