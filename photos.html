<!DOCTYPE html>
<html lang="fr">
<head>

  <link rel="stylesheet" href="style.css" />

<div class="lightbox" id="lightbox">
  <span class="lightbox-close">&times;</span>
  <img class="lightbox-image" src="" alt="">
</div>

<body class="photos-page">

<div class="language-switch">
  <div class="lang-item" onclick="setLanguage('fr')">
    <img src="images/flag.png" alt="Français" />
    <span>FR</span>
  </div>
  <div class="lang-item" onclick="setLanguage('en')">
    <img src="images/flag.png" alt="English" />
    <span>EN</span>
  </div>
</div>

<div class="hero-overlay">
  <div class="logo-container">
    <img src="images/logo_PeB.png" alt="Logo Nordic Horizons Yukon" />
  </div>

  <nav class="main-nav">
    <a href="index.html" data-i18n="menu_home"></a>
    <a href="about.html" data-i18n="menu_about"></a>
    <a href="photos.html" data-i18n="menu_photos"></a>
    <a href="contact.html" data-i18n="menu_contact"></a>
  </nav>
</div>

<!-- ===== Carrossel ===== -->
<div class="carousel">
  <div class="carousel-track">
    <div class="carousel-slide"><img src="images/photos/photo1.png" alt="Photo 1"></div>
    <div class="carousel-slide"><img src="images/photos/photo2.png" alt="Photo 2"></div>
    <div class="carousel-slide"><img src="images/photos/photo3.png" alt="Photo 3"></div>
  </div>
  <div class="carousel-buttons">
    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>
  </div>
</div>

<!-- ===== Grid de fotos ===== -->
<section class="photo-grid">
  <img src="images/photos/photo4.png" alt="Photo 4">
  <img src="images/photos/photo5.png" alt="Photo 5">
  <img src="images/photos/photo6.png" alt="Photo 6">
  <img src="images/photos/photo7.png" alt="Photo 7">
  <img src="images/photos/photo8.png" alt="Photo 8">
  <img src="images/photos/photo9.png" alt="Photo 9">
</section>

<footer>
  <div class="footer-content">
    <div class="footer-left">
      <p>
        <span data-i18n="footer_email"></span>:
        <a href="mailto:nordichorizons.yukon@gmail.com">nordichorizons.yukon@gmail.com</a><br>
        <span data-i18n="footer_phone"></span>:
        <a href="tel:+18673343213">+1 867 334 3213</a>
      </p>
    </div>
    <div class="footer-center">
      <p>
        <span data-i18n="footer_rights"></span>

      </a>
      <a href="https://instagram.com/nordichorizonsyukon" target="_blank">
        <img src="images/instagram.png" alt="Instagram">
      </a>
