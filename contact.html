<!-- ======================= contact.html ======================= -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nordic Horizons Yukon | Contact</title>
  <meta name="description" content="Contactez Nordic Horizons Yukon pour vos services de transport touristique et logistique au Yukon, Canada." />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="contact-page">

<div class="language-switch">
  <div class="lang-item" onclick="setLanguage('fr')">
    <img src="images/flag.png" alt="Français" />
    <span>FR</span>
  </div>
  <div class="lang-item" onclick="setLanguage('en')">
    <img src="images/flag.png" alt="English" />
    <span>EN</span>
  </div>
</div>

<div class="hero-overlay">
  <div class="logo-container">
    <img src="images/logo_PeB.png" alt="Logo Nordic Horizons Yukon" />
  </div>

  <nav class="main-nav">
    <a href="index.html" data-i18n="menu_home">Accueil</a>
    <a href="about.html" data-i18n="menu_about">À propos</a>
    <a href="photos.html" data-i18n="menu_photos">Photos</a>
    <a href="contact.html" data-i18n="menu_contact">Contact</a>
  </nav>

  <div class="hero-text">
    <h1 data-i18n="contact_title">Contactez-Nous</h1>
    <p data-i18n="contact_text">Nous serons ravis de répondre à vos questions et demandes de transport.</p>
  </div>
</div>

<main class="content">
  <section class="contact-section">
    <form class="contact-form">
      <label for="name" data-i18n="form_name">Nom</label>
      <input type="text" id="name" name="name" placeholder="" required>

      <label for="email" data-i18n="form_email">Email</label>
      <input type="email" id="email" name="email" placeholder="" required>

      <label for="message" data-i18n="form_message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="" required></textarea>

      <button type="submit" data-i18n="form_send">Envoyer</button>
    </form>
  </section>
</main>

<footer>
  <div class="footer-content">
    <div class="footer-left">
      <p>
        <span data-i18n="footer_email">Email</span>:
        <a href="mailto:nordichorizons.yukon@gmail.com">nordichorizons.yukon@gmail.com</a><br>
        <span data-i18n="footer_phone">Tel</span>:
        <a href="tel:+18675551234">+1 867 334 3213</a>
      </p>
    </div>

    <div class="footer-center">
      <p>
        <span data-i18n="footer_rights"></span>
        <a href="https://www.seusite.com" target="_blank" rel="noopener">Douglas Portela</a>
      </p>
    </div>

    <div class="footer-right">
      <a href="https://facebook.com/nordichorizonsyukon" target="_blank">
        <img src="images/facebook.png" alt="Facebook">
      </a>
      <a href="https://instagram.com/nordichorizonsyukon" target="_blank">
        <img src="images/instagram.png" alt="Instagram">
      </a>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
